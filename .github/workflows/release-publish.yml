name: Release publish

# 发布入口已切换到 Avalonia 桌面端（PCL.Desktop）。
# 旧 WPF 客户端已冻结，不再参与默认构建与发布。
permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration (Beta is published as prerelease)'
        required: true
        default: Beta
        type: choice
        options:
          - Release
          - Beta
      version:
        description: 'Version to release (e.g., 2.14.2)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

jobs:
  prepare:
    name: Resolve release parameters
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      configuration: ${{ steps.resolve.outputs.configuration }}
    steps:
      - name: Resolve version and configuration
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CONFIGURATION: ${{ inputs.configuration }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${INPUT_VERSION:-${REF_NAME#v}}"
          configuration="${INPUT_CONFIGURATION:-Release}"
          [[ "$version" =~ ^[0-9][0-9A-Za-z.+-]*$ ]] || { echo "Invalid release version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "configuration=$configuration" >> "$GITHUB_OUTPUT"

  desktop:
    needs: [prepare]
    uses: ./.github/workflows/cross-platform.yml
    with:
      configuration: ${{ needs.prepare.outputs.configuration }}

  changelog:
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: git-cliff

      - name: Create local release tag
        run: git tag -f "v${{ needs.prepare.outputs.version }}"

      - name: Generate changelog
        run: git-cliff --latest -o CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Release ${{ needs.prepare.outputs.version }}
          body_path: CHANGELOG.md
          prerelease: ${{ needs.prepare.outputs.configuration == 'Beta' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_desktop:
    needs: [prepare, desktop, changelog]
    permissions:
      actions: read
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          merge-multiple: true
          path: artifact
      - name: Add release version to package names
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for path in artifact/PCL-CE-*.tar.gz; do
            name=$(basename "$path" .tar.gz)
            mv "$path" "$name-$VERSION.tar.gz"
          done
      - name: Sign desktop packages
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: PCL-CE-*.tar.gz
          verify: true
          verify-cert-identity: https://github.com/${{ github.repository }}/.github/workflows/release-publish.yml@${{ github.ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
      - name: Attach desktop packages to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          tag_name: v${{ needs.prepare.outputs.version }}
          files: |
            PCL-CE-*.tar.gz
            PCL-CE-*.sigstore.json

  publish_draft:
    needs: [prepare, publish_desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Publish Draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
