name: Cross-platform desktop

on:
  workflow_call:
    inputs:
      configuration:
        type: string
        default: Release
        required: false
  # 冻结：旧跨平台客户端不再随 push / PR 自动构建。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  AVALONIA_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  BUILD_CONFIGURATION: ${{ inputs.configuration || 'Release' }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rids: 'linux-x64 linux-arm64'
          - os: windows-latest
            rids: 'win-x64 win-arm64'
          - os: macos-latest
            rids: 'osx-x64 osx-arm64'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
      - name: Test kernel and desktop
        run: dotnet test PCL.Tests/PCL.Tests.csproj -c CI --logger "trx;LogFileName=desktop.trx" --results-directory TestResults
      - name: Publish desktop targets
        shell: bash
        run: |
          for rid in ${{ matrix.rids }}; do
            dotnet publish PCL.Desktop/PCL.Desktop.csproj -c "$BUILD_CONFIGURATION" -r "$rid" --self-contained true -o "artifact/$rid"
            name="PCL-CE-$rid"
            if [[ "$BUILD_CONFIGURATION" == "Beta" ]]; then
              name="PCL-CE-Beta-$rid"
            fi
            tar -czf "artifact/$name.tar.gz" -C "artifact/$rid" .
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.os }}
          path: artifact/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: desktop-tests-${{ matrix.os }}
          path: TestResults/*.trx
