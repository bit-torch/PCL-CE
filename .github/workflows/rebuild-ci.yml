name: Rebuild CI

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: rebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test PCL.Rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build PCL.Rebuild.slnx -c Release

      - name: Test
        run: dotnet test PCL.Rebuild.slnx -c Release --no-build
